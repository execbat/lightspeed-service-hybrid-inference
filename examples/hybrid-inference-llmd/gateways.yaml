# Requires Envoy Gateway with InferencePool support enabled.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: hybrid-llmd
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: cpu-small-router
  namespace: openshift-lightspeed
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: cpu-small-router
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cpu-small-router
  namespace: openshift-lightspeed
spec:
  gatewayClassName: hybrid-llmd
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: cpu-small-router
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: gpu-large-router
  namespace: openshift-lightspeed
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: gpu-large-router
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gpu-large-router
  namespace: openshift-lightspeed
spec:
  gatewayClassName: hybrid-llmd
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: gpu-large-router
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
