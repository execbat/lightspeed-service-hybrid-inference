apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cpu-small-llmd
  namespace: openshift-lightspeed
spec:
  parentRefs:
    - name: cpu-small-router
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/chat/completions
        - path:
            type: Exact
            value: /v1/completions
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: cpu-small-inference-pool
          port: 8000
      timeouts:
        request: 0s
        backendRequest: 0s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gpu-large-llmd
  namespace: openshift-lightspeed
spec:
  parentRefs:
    - name: gpu-large-router
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/chat/completions
        - path:
            type: Exact
            value: /v1/completions
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: gpu-large-inference-pool
          port: 8000
      timeouts:
        request: 0s
        backendRequest: 0s
