listeners:
  - name: gateway
    address: 0.0.0.0:8080
    filter_chains:
      - main
filter_chains:
  - name: main
    filters:
      - filter: static_response
        status: 200
        headers:
          - name: Content-Type
            value: application/json
        body: '{"status": "ok"}'
        conditions:
          - when:
              path: /healthz
      - filter: static_response
        status: 200
        headers:
          - name: Content-Type
            value: application/json
        body: '{"object": "list", "data": [{"id": "hybrid-model", "object": "model", "created":
          0, "owned_by": "praxis"}]}'
        conditions:
          - when:
              path: /v1/models
              methods:
                - GET
      - filter: router
        routes:
          - path_prefix: /
            headers:
              X-OLS-Mode: ask
            cluster: cpu-small
          - path_prefix: /
            cluster: gpu-large
      - filter: load_balancer
        clusters:
          - name: cpu-small
            endpoints:
              - cpu-small-router.envoy-gateway-system.svc.cluster.local:80
          - name: gpu-large
            endpoints:
              - gpu-large-router.envoy-gateway-system.svc.cluster.local:80
insecure_options:
  allow_private_endpoints: true
  allow_private_upstreams: true
