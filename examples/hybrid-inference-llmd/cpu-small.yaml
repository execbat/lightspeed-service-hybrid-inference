apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: cpu-small
  namespace: openshift-lightspeed
spec:
  replicas: 1
  model:
    uri: hf://Qwen/Qwen-AgentWorld-35B-A3B
    name: hybrid-model
  router:
    gateway:
      refs:
        - name: cpu-small-router
          namespace: openshift-lightspeed
    route:
      http:
        refs:
          - name: cpu-small-llmd
    scheduler: {}
  template:
    nodeSelector:
      inference: cpu-small
    tolerations:
      - key: inference
        operator: Equal
        value: cpu-small
        effect: NoSchedule
    containers:
      - name: main
        image: registry.redhat.io/rhaii/vllm-cpu-rhel9:3.5
        env:
          - name: VLLM_ADDITIONAL_ARGS
            value: >-
              --max-model-len=32768 --enable-auto-tool-choice --tool-call-parser=qwen3_coder
              --reasoning-parser=qwen3 --language-model-only --default-chat-template-kwargs='{"enable_thinking":
              false}' --enable-prefix-caching
          - name: VLLM_CPU_OMP_THREADS_BIND
            value: 16-30
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: HF_TOKEN
                optional: true
          - name: HF_HUB_OFFLINE
            value: '0'
        resources:
          requests:
            cpu: '24'
            memory: 100Gi
          limits:
            cpu: '28'
            memory: 128Gi
